name: Build APK (Android)
on:
  workflow_dispatch:
  push:
    paths: ["www/**", "package.json", ".github/workflows/build-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Download the Bible and Firebase files
        run: |
          curl -fL -o www/bible-en.json https://raw.githubusercontent.com/thiagobodruk/bible/master/json/en_kjv.json || true
          curl -fL -o www/bible-fr.json https://raw.githubusercontent.com/thiagobodruk/bible/master/json/fr_apee.json || true
          sed -i '1s/^\xEF\xBB\xBF//' www/bible-*.json || true
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/ || true
      - run: npx cap add android
      - name: Permissions and version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK INTERNET; do
            sed -i "s#</manifest>#<uses-permission android:name=\"android.permission.$p\"/></manifest>#" $M
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Use the permanent signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "No key secret found: temporary key used"; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BonAppetit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
