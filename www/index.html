<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bon Appétit !</title>
<style>
:root{--bg:#FFF8DC;--card:#fff;--ink:#2d1a0f;--mut:#7a6a4f;--y:#FFB800;--y2:#FFD966;--r:#E31B23;--ln:#0001;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e140c;--card:#2e2015;--ink:#fff1cf;--mut:#c9b48a;--ln:#fff2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e140c;--card:#2e2015;--ink:#fff1cf;--mut:#c9b48a;--ln:#fff2;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--card);padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--y)}
header img{height:38px;border-radius:8px;background:#fff;margin-right:auto}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 14px;border:1px solid var(--ln);box-shadow:0 4px 0 var(--ln)}
.hero{background:linear-gradient(135deg,var(--y),var(--y2));color:#2d1a0f;border:0}
.wave{height:22px;background:var(--y);-webkit-mask:radial-gradient(11px at 11px 0,#0000 98%,#000) 0 0/22px 22px;mask:radial-gradient(11px at 11px 0,#0000 98%,#000) 0 0/22px 22px;margin:-4px 0 12px}
h2{margin:2px 0 10px;font-size:19px;display:flex;gap:8px;align-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:9px 14px;background:var(--y);color:#2d1a0f;margin:3px 3px 3px 0;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
button.d{background:var(--ink);color:var(--bg)}button.g{background:var(--ln);color:var(--ink)}button.red{background:var(--r);color:#fff}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border-radius:12px;border:2px solid var(--y2);background:var(--bg);color:var(--ink);margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--y);z-index:6}
nav button{background:none;flex-direction:column;gap:0;font-size:11px;padding:4px 8px;margin:0;color:var(--mut)}nav button.on{background:var(--y);color:#2d1a0f}
.v{padding:1px 0}.v sup{color:var(--r);font-weight:800;cursor:pointer;padding:0 4px}.ct{border-bottom:1px dashed var(--ln)}
.dot{display:inline-block;width:32px;height:32px;border-radius:50%;margin:2px;border:2px solid var(--ln);cursor:pointer}
#tb{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--card);border:2px solid var(--y);border-radius:18px;padding:6px;display:none;z-index:7;text-align:center}
.tag{font-size:12px;background:var(--y2);color:#2d1a0f;border-radius:10px;padding:2px 8px;margin-left:6px;font-weight:700}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:14px}.sp{margin-left:auto}
.bub{max-width:82%;padding:8px 12px;border-radius:18px;margin:4px 0;background:var(--ln)}.bub.me{background:var(--y);margin-left:auto;color:#2d1a0f}.bub small{display:block;font-size:11px;opacity:.7}
#al{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#al>div{background:var(--card);border-radius:24px;padding:22px;text-align:center;max-width:360px;animation:sh .5s infinite alternate}
@keyframes sh{to{transform:rotate(2deg) scale(1.03)}}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}
.lid{transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-origin:20px 62px}.open .lid{transform:translate(10px,-30px) rotate(-18deg)}
#bottle{width:90px;margin:auto;transition:transform 3s cubic-bezier(.2,.8,.2,1)}#bottle svg{width:90px;height:90px;stroke-width:1.5}
.ch{border:2px solid var(--y);border-radius:20px;padding:3px 10px;font-size:14px;background:none;color:var(--ink)}.ch.on{background:var(--y);color:#2d1a0f}
img.p,video.p{max-width:100%;border-radius:14px}
#toast{position:fixed;top:70px;left:12px;right:12px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;z-index:20;display:none;text-align:center}
.card{animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.hero{background:linear-gradient(120deg,#FFB800,#FFD966,#FFB6C1,#FFD966,#FFB800);background-size:220% 220%;animation:up .45s both,gl 9s ease infinite}@keyframes gl{50%{background-position:100% 50%}}
button,.btn{transition:transform .12s}button:active,.btn:active{transform:scale(.94)}
nav button.on svg{animation:bn .5s}@keyframes bn{40%{transform:translateY(-6px) scale(1.25)}}
header img{animation:up .6s both}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--y),var(--r));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
#fb{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FFB800,#E31B23);color:#fff;display:none;align-items:center;justify-content:center;z-index:8;box-shadow:0 6px 16px #0005;animation:pl 2.4s infinite;padding:0;margin:0}@keyframes pl{50%{transform:scale(1.1)}}
#mb{position:fixed;left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom,0px));height:44vh;background:var(--card);border:2px solid var(--y);border-radius:20px;z-index:8;display:none;flex-direction:column;padding:8px;box-shadow:0 8px 24px #0006}
#mbl{flex:1;overflow:auto}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:30;border-radius:2px;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head><body>

var BI=[{f:"Psaume 23",e:"Psalm 23",fr:["L’Éternel est mon berger : je ne manquerai de rien.","Il me fait reposer dans de verts pâturages, il me dirige près des eaux paisibles.","Il restaure mon âme, il me conduit dans les sentiers de la justice, à cause de son nom.","Quand je marche dans la vallée de l’ombre de la mort, je ne crains aucun mal, car tu es avec moi : ta houlette et ton bâton me rassurent.","Tu dresses devant moi une table, en face de mes ennemis ; tu oins d’huile ma tête, et ma coupe déborde.","Oui, le bonheur et la grâce m’accompagneront tous les jours de ma vie, et j’habiterai dans la maison de l’Éternel jusque dans de longues années."],en:["The LORD is my shepherd; I shall not want.","He maketh me to lie down in green pastures: he leadeth me beside the still waters.","He restoreth my soul: he leadeth me in the paths of righteousness for his name’s sake.","Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.","Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.","Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever."]},
